server:
  port: ${PORT:8085}
  address: 0.0.0.0

spring:
  application:
    name: vyapar-samraj-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5          # Neon serverless: keep pool small
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate            # Flyway manages schema — Hibernate validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:financeempire2121@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:ptnabqzqttjadxyo}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# JWT configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 604800000        # 7 days
    cookie-name: sa_session

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://192.168.55.103:3000}

  rate-limit:
    login:
      capacity: 5                   # 5 attempts
      refill-minutes: 15            # per 15 minutes per IP

# Actuator — expose only health and info publicly
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Vyapar Samraj Backend
    version: 1.0.0

logging:
  level:
    root: INFO
    com.vyaparsamraj: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: 10

logging:
  level:
    root: WARN
    com.vyaparsamraj: INFO
